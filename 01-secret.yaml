# Credenciales del superusuario de PostgreSQL.
#
# ⚠️  Este archivo es un EJEMPLO. No contiene una password real.
# Generá la password antes de aplicar:
#   POSTGRES_PASSWORD=$(openssl rand -base64 24 | tr -d '/+=')
# Luego reemplaza REEMPLAZAR_PASSWORD abajo con el valor generado.
#
# Para crear una DB/usuario por app, conectate como superusuario y ejecutá:
#   CREATE DATABASE <app>;
#   CREATE USER <app> WITH PASSWORD '<password>';
#   GRANT ALL PRIVILEGES ON DATABASE <app> TO <app>;
#
# En producción, preferí usar un gestor de secretos (Sealed Secrets,
# SOPS, HashiCorp Vault) en vez de un K8s Secret plano.

apiVersion: v1
kind: Secret
metadata:
  name: postgres-admin
  namespace: postgresql
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "REEMPLAZAR_PASSWORD"
